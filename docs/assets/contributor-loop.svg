<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CrossTide contributor loop</title>
  <desc id="desc">A contributor selects a future roadmap item, makes a focused change, runs a narrow check, runs the full gates, opens a pull request, and feeds the evidence back into the roadmap.</desc>
  <style>
    .bg { fill: #f5fbfb; }
    .node { fill: #fff; stroke: #0f766e; stroke-width: 2; }
    .accent { fill: #c2410c; }
    .text { fill: #123047; font: 700 22px 'Aptos Display', 'Segoe UI', sans-serif; }
    .small { fill: #28616b; font: 500 16px 'Aptos', 'Segoe UI', sans-serif; }
    .arrow { fill: none; stroke: #0e7490; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18" />
  <text class="text" x="60" y="58">The focused delivery loop</text>
  <text class="small" x="60" y="88">Small scope, executable evidence, and no silent gaps.</text>
  <circle class="accent" cx="600" cy="280" r="82" />
  <text fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="700" x="600" y="272" text-anchor="middle">Future</text>
  <text fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="700" x="600" y="305" text-anchor="middle">roadmap</text>
  <rect class="node" x="80" y="170" width="230" height="100" rx="14" />
  <text class="text" x="195" y="212" text-anchor="middle">1. Select</text>
  <text class="small" x="195" y="240" text-anchor="middle">issue + owner + scope</text>
  <rect class="node" x="80" y="360" width="230" height="100" rx="14" />
  <text class="text" x="195" y="402" text-anchor="middle">2. Implement</text>
  <text class="small" x="195" y="430" text-anchor="middle">code + tests together</text>
  <rect class="node" x="890" y="170" width="230" height="100" rx="14" />
  <text class="text" x="1005" y="212" text-anchor="middle">3. Verify</text>
  <text class="small" x="1005" y="240" text-anchor="middle">focused check first</text>
  <rect class="node" x="890" y="360" width="230" height="100" rx="14" />
  <text class="text" x="1005" y="402" text-anchor="middle">4. Review</text>
  <text class="small" x="1005" y="430" text-anchor="middle">PR + full gates + evidence</text>
  <path class="arrow" d="M310 220 H500" />
  <path class="arrow" d="M310 410 H500" />
  <path class="arrow" d="M700 220 H890" />
  <path class="arrow" d="M700 410 H890" />
  <path class="arrow" d="M1005 170 C1005 100 195 100 195 170" />
  <text class="small" x="600" y="125" text-anchor="middle">Update status only when acceptance evidence exists</text>
</svg>
