<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CrossTide layered architecture</title>
  <desc id="desc">Types feed domain calculations, which feed core state, providers, cards, and the UI. Workers and the Cloudflare Worker consume the lower layers.</desc>
  <style>
    .bg { fill: #07111f; }
    .layer { stroke: #c9f7f0; stroke-opacity: 0.48; stroke-width: 2; rx: 16; }
    .types { fill: #0f766e; }
    .domain { fill: #0e7490; }
    .core { fill: #1d4ed8; }
    .providers { fill: #0f766e; }
    .cards { fill: #c2410c; }
    .ui { fill: #b45309; }
    .edge { fill: #17324a; }
    .text { fill: #fff; font: 700 23px 'Aptos Display', 'Segoe UI', sans-serif; }
    .small { fill: #d8f3f0; font: 500 15px 'Aptos', 'Segoe UI', sans-serif; }
    .arrow { fill: none; stroke: #74ddd2; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74ddd2" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18" />
  <text class="text" x="60" y="58">CrossTide architecture</text>
  <text class="small" x="60" y="88">One-way imports keep calculations portable and presentation replaceable.</text>
  <rect class="layer types" x="60" y="150" width="190" height="90" />
  <text class="text" x="155" y="190" text-anchor="middle">Types</text>
  <text class="small" x="155" y="218" text-anchor="middle">contracts</text>
  <rect class="layer domain" x="290" y="150" width="190" height="90" />
  <text class="text" x="385" y="190" text-anchor="middle">Domain</text>
  <text class="small" x="385" y="218" text-anchor="middle">pure calculations</text>
  <rect class="layer core" x="520" y="150" width="190" height="90" />
  <text class="text" x="615" y="190" text-anchor="middle">Core</text>
  <text class="small" x="615" y="218" text-anchor="middle">state and fetch</text>
  <rect class="layer providers" x="750" y="150" width="190" height="90" />
  <text class="text" x="845" y="190" text-anchor="middle">Providers</text>
  <text class="small" x="845" y="218" text-anchor="middle">validated data</text>
  <rect class="layer cards" x="980" y="150" width="160" height="90" />
  <text class="text" x="1060" y="190" text-anchor="middle">Cards</text>
  <text class="small" x="1060" y="218" text-anchor="middle">views</text>
  <path class="arrow" d="M250 195 H285" />
  <path class="arrow" d="M480 195 H515" />
  <path class="arrow" d="M710 195 H745" />
  <path class="arrow" d="M940 195 H975" />
  <rect class="layer ui" x="455" y="350" width="290" height="95" />
  <text class="text" x="600" y="392" text-anchor="middle">UI shell</text>
  <text class="small" x="600" y="420" text-anchor="middle">router, theme, accessibility</text>
  <path class="arrow" d="M1060 240 V300 H600 V345" />
  <rect class="layer edge" x="80" y="500" width="250" height="70" />
  <text class="text" x="205" y="542" text-anchor="middle">Compute workers</text>
  <path class="arrow" d="M385 240 V300 H205 V495" />
  <rect class="layer edge" x="870" y="500" width="250" height="70" />
  <text class="text" x="995" y="542" text-anchor="middle">Cloudflare Worker</text>
  <path class="arrow" d="M615 240 V300 H995 V495" />
</svg>
