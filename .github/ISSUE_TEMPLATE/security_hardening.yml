name: Security Hardening Suggestion
description: Suggest a non-sensitive security improvement (do NOT use this for a vulnerability report)
title: "[Security]: "
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Do not report an exploitable vulnerability here.** Use
        [GitHub's private vulnerability reporting](https://github.com/RajwanYair/CrossTide/security/advisories/new)
        instead — see [`SECURITY.md`](../SECURITY.md). This public template is only for
        general hardening ideas (e.g. "consider adding X header", "this dependency has a
        better-maintained alternative") that carry no immediate exploitation risk.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is a hardening suggestion, not a reportable vulnerability with a working exploit or disclosed CVE against this codebase.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CSP / headers
        - CORS
        - Rate limiting / abuse controls
        - Dependency / supply chain
        - Input validation
        - Secrets / configuration
        - Worker (Cloudflare) security
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Suggestion
      description: What would you change, and why?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference (optional)
      description: Link an OWASP guideline, advisory, or best-practice doc that motivates this.
