name: Build docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # astro 7.x requires Node >=22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Build Astro site
        # Must use the workspace-installed Astro: `npx astro` can fetch a fresh
        # copy from the registry, which then resolves a CommonJS `cookie` and
        # fails with "Named export 'parseCookie' not found".
        run: npm run build --workspace docs-site
        working-directory: .
        env:
          BASE_URL: /CrossTide/docs/
